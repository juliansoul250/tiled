name: Validate layer fixes on macOS and Windows

# Confined to this public validation branch; no signing, deployment, or secrets.
on:
  workflow_dispatch:
  push:
    branches: [fix/layer-stability-ui]
    paths:
      - '.github/workflows/layer-ui-validation.yml'
      - 'tiled.qbs'
      - 'qbs/**'
      - 'src/**'
      - 'tests/**'
      - 'dist/**'
      - 'translations/**'
      - '!dist/macos/build-fork-package.sh'
      - '!dist/macos/verify-fork-package.py'
      - '!tests/test_macos_package_audit.py'
      - '!tests/verify_package_source_baseline.py'

permissions:
  contents: read

jobs:
  macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, xcode-27]
        qt: ['6.11.3']
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          arch: clang_64
          cache: true
      - name: Install and configure Qbs
        run: |
          brew install qbs
          echo "$(brew --prefix qbs)/bin" >> "$GITHUB_PATH"
          export PATH="$(brew --prefix qbs)/bin:$PATH"
          qbs setup-toolchains --detect
          qbs setup-qt "$QT_ROOT_DIR/bin/qmake" qt
          qbs config profiles.qt.baseProfile xcode
          qbs config --list
      - name: Verify donation UX removal and retained attribution
        run: |
          python tests/check_fork_ui_policy.py
          python tests/check_chinese_translation.py
      - name: Build shared editor source and focused tests
        run: qbs build profile:qt config:debug projects.Tiled.nativeWidgetTests:true -p tiled,test_layers,test_uistyle,test_layerwidgets
      - name: Run layer regressions
        run: qbs run profile:qt config:debug projects.Tiled.nativeWidgetTests:true -p test_layers -- -o "$GITHUB_WORKSPACE/layers.txt,txt"
      - name: Run UI regressions at 1x and 2x
        run: |
          qbs run profile:qt config:debug projects.Tiled.nativeWidgetTests:true -p test_uistyle -- -o "$GITHUB_WORKSPACE/uistyle-1x.txt,txt"
          QT_SCALE_FACTOR=2 qbs run profile:qt config:debug projects.Tiled.nativeWidgetTests:true -p test_uistyle -- -o "$GITHUB_WORKSPACE/uistyle-2x.txt,txt"
      - name: Run exposed Cocoa layer widgets (no offscreen fallback)
        timeout-minutes: 30
        env:
          QT_QPA_PLATFORM: cocoa
          TILED_EXPECT_CHINESE: '1'
          TILED_RUN_SOAK: ${{ matrix.os == 'xcode-27' }}
          TILED_REQUIRE_COCOA: '1'
          QTEST_FUNCTION_TIMEOUT: '60000'
          TILED_WIDGET_ARTIFACTS: ${{ github.workspace }}/native-widget-results
        run: |
          mkdir -p "$TILED_WIDGET_ARTIFACTS"
          sw_vers > "$TILED_WIDGET_ARTIFACTS/environment.txt"
          uname -m >> "$TILED_WIDGET_ARTIFACTS/environment.txt"
          xcodebuild -version >> "$TILED_WIDGET_ARTIFACTS/environment.txt"
          python3 - <<'PYTHON'
          import os, pathlib, signal, subprocess, sys
          out = pathlib.Path(os.environ['TILED_WIDGET_ARTIFACTS'])
          apps = [p.resolve() for p in pathlib.Path('debug/install-root').rglob('Tiled.app')
                  if (p / 'Contents/MacOS/Tiled').is_file()]
          if len(apps) != 1:
              raise RuntimeError('Expected one built Tiled application for translation checks')
          os.environ['TILED_CHINESE_CATALOG'] = str(apps[0] / 'Contents/Translations/tiled_zh_CN.qm')
          command = ['qbs', 'run', 'profile:qt', 'config:debug', 'projects.Tiled.nativeWidgetTests:true', '-p', 'test_layerwidgets', '--']
          # Scoped to this disposable CI account, never the user's Mac. Keep the
          # application accessibility behavior intact and test BOTH real states.
          preference = ['com.apple.universalaccess', 'reduceTransparency']
          original = subprocess.run(['defaults', 'read', *preference], capture_output=True, text=True, timeout=15)
          if original.returncode and 'does not exist' not in original.stderr:
              raise RuntimeError('Cannot inspect accessibility preference: ' + original.stderr)
          old = original.stdout.strip() if original.returncode == 0 else None
          if old not in (None, '0', '1'):
              raise RuntimeError('Unexpected reduceTransparency value; refusing to replace it: ' + old)
          (out / 'accessibility-environment.txt').write_text('Original reduceTransparency=' + str(old) + '\n')
          def run_test(stem, functions=(), expect_reduced=False):
              env = os.environ.copy()
              env.pop('TILED_EXPECT_SYSTEM_REDUCED_TRANSPARENCY', None)
              if expect_reduced:
                  env['TILED_EXPECT_SYSTEM_REDUCED_TRANSPARENCY'] = '1'
              with (out / (stem + '-console.txt')).open('w') as log:
                  args = command + list(functions) + ['-o', str(out / (stem + '.txt')) + ',txt',
                                                     '-o', str(out / (stem + '.xml')) + ',junitxml']
                  process = subprocess.Popen(args, env=env, stdout=log, stderr=subprocess.STDOUT, start_new_session=True)
                  try:
                      result = process.wait(timeout=180)
                  except subprocess.TimeoutExpired:
                      os.killpg(process.pid, signal.SIGKILL)
                      process.wait()
                      log.write('\nNative widget test exceeded 180 seconds; infrastructure/test failure.\n')
                      result = 124
                  if result:
                      raise subprocess.CalledProcessError(result, args)
              if 'adding an unknown subview' in (out / (stem + '-console.txt')).read_text():
                  raise RuntimeError('AppKit rejected a material view hierarchy')
          try:
              subprocess.run(['defaults', 'write', *preference, '-bool', 'true'], check=True, timeout=15)
              run_test('system-opaque', ['nativeMaterialAndOpaqueFallback'], expect_reduced=True)
              subprocess.run(['defaults', 'write', *preference, '-bool', 'false'], check=True, timeout=15)
              run_test('tests')
              subprocess.run(['python3', 'tests/native_app_smoke.py'], check=True, timeout=150)
              if os.environ.get('TILED_RUN_SOAK') == 'true':
                  subprocess.run(['python3', 'tests/native_stability_soak.py'], check=True, timeout=1170)
          finally:
              if old is None:
                  subprocess.run(['defaults', 'delete', *preference], check=True, timeout=15)
              else:
                  subprocess.run(['defaults', 'write', *preference, '-bool', 'true' if old == '1' else 'false'], check=True, timeout=15)
              restored = subprocess.run(['defaults', 'read', *preference], capture_output=True, text=True, timeout=15)
              restored_value = restored.stdout.strip() if restored.returncode == 0 else None
              with (out / 'accessibility-environment.txt').open('a') as log:
                  log.write('Restored reduceTransparency=' + str(restored_value) + '\n')
              if restored_value != old:
                  raise RuntimeError('Accessibility preference restoration did not match original')
          PYTHON
      - name: Collect native failure evidence from isolated runner
        if: failure()
        run: |
          mkdir -p native-widget-results
          screencapture -x native-widget-results/failure-desktop.png || true
          python3 - <<'PYTHON'
          import pathlib, shutil
          reports = pathlib.Path.home() / 'Library/Logs/DiagnosticReports'
          destination = pathlib.Path('native-widget-results')
          if reports.exists():
              for report in reports.glob('test_layerwidgets*'):
                  if report.is_file() and report.suffix in ('.ips', '.crash'):
                      shutil.copy2(report, destination / report.name)
          PYTHON
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.os }}-cocoa-widget-results-qt${{ matrix.qt }}
          path: native-widget-results/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ${{ matrix.os }}-layer-ui-results-qt${{ matrix.qt }}
          path: |
            layers.txt
            uistyle-*.txt
          if-no-files-found: warn

  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: win64_msvc2022_64
          cache: true
      - name: Install and configure Qbs
        shell: pwsh
        run: |
          choco install -y qbs
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw 'No installed MSVC x64 toolchain was found.' }
          $toolset = (Get-Content "$vs\VC\Auxiliary\Build\Microsoft.VCToolsVersion.default.txt").Trim()
          $compiler = "$vs\VC\Tools\MSVC\$toolset\bin\Hostx64\x64\cl.exe"
          if (-not (Test-Path $compiler)) { throw "MSVC compiler not found: $compiler" }
          qbs setup-toolchains --type msvc "$compiler" native-msvc
          qbs setup-qt "$env:QT_ROOT_DIR\bin\qmake.exe" qt
          qbs config profiles.qt.baseProfile native-msvc
          qbs config --list
      - name: Verify donation UX removal and retained attribution
        run: |
          python tests/check_fork_ui_policy.py
          python tests/check_chinese_translation.py
      - name: Build shared editor source and focused tests
        run: qbs build profile:qt config:debug -p tiled,test_layers,test_uistyle
      - name: Run layer regressions
        run: qbs run profile:qt config:debug -p test_layers -- -o "$env:GITHUB_WORKSPACE/layers.txt,txt"
      - name: Run UI regressions at 1x and 2x
        run: |
          qbs run profile:qt config:debug -p test_uistyle -- -o "$env:GITHUB_WORKSPACE/uistyle-1x.txt,txt"
          $env:QT_SCALE_FACTOR = '2'
          qbs run profile:qt config:debug -p test_uistyle -- -o "$env:GITHUB_WORKSPACE/uistyle-2x.txt,txt"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: windows-layer-ui-results
          path: |
            layers.txt
            uistyle-*.txt
          if-no-files-found: warn

  macos-package:
    needs: [macos, windows]
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.11.3'
          arch: clang_64
          modules: qtimageformats
          cache: true
      - name: Install Qbs
        run: |
          brew install qbs
          echo "$(brew --prefix qbs)/bin" >> "$GITHUB_PATH"
      - name: Build production app, audit deployment and smoke relocated bundle
        env:
          TILED_WIDGET_ARTIFACTS: ${{ github.workspace }}/package-results
          TILED_SMOKE_SECONDS: '900'
        run: python3 tests/with_native_transparency.py bash dist/macos/build-fork-package.sh
      - uses: actions/upload-artifact@v6
        with:
          name: Tiled-macOS-Qt6.11.3-ad-hoc
          path: |
            Tiled-macOS-Qt6.11.3-ad-hoc.zip
            Tiled-macOS-Qt6.11.3-ad-hoc.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: macos-deployed-app-validation
          path: package-results/
          if-no-files-found: warn
